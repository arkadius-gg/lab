# Todo lo de cluster/plataforma: descifrado con sops-age y con las variables de cluster-vars.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plataforma
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/plataforma
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
