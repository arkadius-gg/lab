# Loki monolítico (un solo pod en plataforma), logs en disco local, retención 7 días.
# Recibe OTLP en /otlp desde el collector. Claves comprobadas en el chart 21.2.3: el componente
# monolítico se configura en singleBinary; este chart ya no trae minio.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitorizacion
spec:
  interval: 1h
  timeout: 15m
  dependsOn: [{name: kps}]
  chart:
    spec:
      chart: loki
      version: 21.2.3
      sourceRef:
        kind: HelmRepository
        name: grafana-community
  values:
    deploymentMode: Monolithic
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2026-11-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index: {prefix: index_, period: 24h}
      limits_config:
        retention_period: 168h
        allow_structured_metadata: true
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 5Gi
        storageClass: local-path
      nodeSelector: {lab/rol: plataforma}
      tolerations: [{key: CriticalAddonsOnly, operator: Exists}]
    read: {replicas: 0}
    write: {replicas: 0}
    backend: {replicas: 0}
    chunksCache: {enabled: false}
    resultsCache: {enabled: false}
    lokiCanary: {enabled: false}
    test: {enabled: false}
    gateway: {enabled: false}
