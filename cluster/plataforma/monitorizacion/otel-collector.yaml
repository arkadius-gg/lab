# Collector de OpenTelemetry en cada nodo: logs de los contenedores (filelog) y OTLP de los
# servicios → Loki (logs), Tempo (trazas) y Prometheus (métricas, por remote write).
# Los servicios apuntan OTEL_EXPORTER_OTLP_ENDPOINT a http://otel-collector.monitorizacion.svc:4318.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: monitorizacion
spec:
  interval: 1h
  timeout: 15m
  dependsOn: [{name: kps}, {name: loki}, {name: tempo}]
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.178.3
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
  values:
    fullnameOverride: otel-collector
    mode: daemonset
    image:
      repository: otel/opentelemetry-collector-contrib
    presets:
      logsCollection: {enabled: true}
      kubernetesAttributes: {enabled: true}
    service:
      enabled: true
    tolerations: [{key: CriticalAddonsOnly, operator: Exists}]   # en los dos nodos: sin nodeSelector
    config:
      receivers:
        filelog:
          operators:   # sustituye a la lista del preset: hay que repetir el parser de contenedor
            - {type: container, id: container-parser}
            # ^[{] y no ^\{: sin barras invertidas no hay escapes que se pierdan por el camino.
            - {type: json_parser, if: 'body matches "^[{]"', parse_from: body, parse_to: attributes}
            - {type: trace_parser, if: 'attributes.trace_id != nil', trace_id: {parse_from: attributes.trace_id}, span_id: {parse_from: attributes.span_id}}
      exporters:
        otlphttp/loki: {endpoint: http://loki.monitorizacion.svc:3100/otlp}
        otlp/tempo: {endpoint: tempo.monitorizacion.svc:4317, tls: {insecure: true}}
        prometheusremotewrite: {endpoint: http://kps-prometheus.monitorizacion.svc:9090/api/v1/write}
      service:
        pipelines:
          logs: {receivers: [otlp, filelog], processors: [memory_limiter, k8sattributes, batch], exporters: [otlphttp/loki]}
          traces: {receivers: [otlp], processors: [memory_limiter, k8sattributes, batch], exporters: [otlp/tempo]}
          metrics: {receivers: [otlp], processors: [memory_limiter, k8sattributes, batch], exporters: [prometheusremotewrite]}
