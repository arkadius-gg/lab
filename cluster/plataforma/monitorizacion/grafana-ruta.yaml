# Grafana en http://grafana.<dominio_base>, por la Gateway de Traefik (Task 10).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitorizacion
spec:
  parentRefs:
    - {name: traefik-gateway, namespace: kube-system, sectionName: web}
  hostnames: ["grafana.${dominio_base}"]
  rules:
    - backendRefs:
        - {name: kps-grafana, port: 80}
