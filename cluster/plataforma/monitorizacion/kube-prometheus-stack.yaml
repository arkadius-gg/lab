# Prometheus, Alertmanager, Grafana y exporters (spec §7). Todo en plataforma salvo
# node-exporter, que va en los dos nodos. Claves comprobadas en el chart 93.3.0.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kps
  namespace: monitorizacion
spec:
  interval: 1h
  timeout: 15m   # el Mac es lento: la primera instalación descarga muchas imágenes
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.3.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: kps

    # k3s no expone etcd, controller-manager, scheduler ni kube-proxy como pods propios.
    kubeEtcd: {enabled: false}
    kubeControllerManager: {enabled: false}
    kubeScheduler: {enabled: false}
    kubeProxy: {enabled: false}
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeProxy: false

    prometheus:
      prometheusSpec:
        nodeSelector: {lab/rol: plataforma}
        tolerations: [{key: CriticalAddonsOnly, operator: Exists}]
        retention: 7d
        retentionSize: 8GB
        enableRemoteWriteReceiver: true   # /api/v1/write, para el collector de OTel
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: [ReadWriteOnce]
              resources: {requests: {storage: 10Gi}}

    alertmanager:
      alertmanagerSpec:
        nodeSelector: {lab/rol: plataforma}
        tolerations: [{key: CriticalAddonsOnly, operator: Exists}]
        secrets: [alertmanager-externos]   # montado en /etc/alertmanager/secrets/alertmanager-externos/
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: [ReadWriteOnce]
              resources: {requests: {storage: 1Gi}}
      config:
        route:
          receiver: telegram
          group_by: [alertname, namespace]
          routes:
            # Watchdog siempre está activa: no se envía (sin interruptor de hombre muerto,
            # decisión del usuario 2026-11-17). Sin esta ruta, iría a Telegram cada 4 h.
            - {matchers: ['alertname=~"Watchdog|InfoInhibitor"'], receiver: "null"}
        receivers:
          - name: "null"
          - name: telegram
            telegram_configs:
              # En bloque, no en {…}: kustomize lee el YAML antes de que Flux sustituya, y las
              # llaves de ${…} dentro de un mapa {…} lo rompen. chat_id sin comillas: Alertmanager
              # exige un número.
              - bot_token_file: /etc/alertmanager/secrets/alertmanager-externos/telegram-token
                chat_id: ${telegram_chat_id}
                send_resolved: true

    grafana:
      nodeSelector: {lab/rol: plataforma}
      tolerations: [{key: CriticalAddonsOnly, operator: Exists}]
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        size: 1Gi
        storageClassName: local-path
      grafana.ini:
        server:
          root_url: http://grafana.${dominio_base}
      additionalDataSources:
        - name: Loki
          uid: loki
          type: loki
          url: http://loki.monitorizacion.svc:3100
          jsonData:
            derivedFields:
              # Cuatro dólares: Flux convierte cada par en uno (quedan dos) y Grafana, que también
              # sustituye variables de entorno al cargar datasources, deja uno. Grafana tiene que
              # acabar con su propia variable __value.raw entre llaves, no con una cadena vacía.
              - {name: trace_id, matcherType: label, matcherRegex: trace_id, datasourceUid: tempo, url: '$$$${__value.raw}'}
        - name: Tempo
          uid: tempo
          type: tempo
          url: http://tempo.monitorizacion.svc:3200
          jsonData:
            tracesToLogsV2: {datasourceUid: loki, filterByTraceID: true}
            serviceMap: {datasourceUid: prometheus}

    kube-state-metrics:
      nodeSelector: {lab/rol: plataforma}
      tolerations: [{key: CriticalAddonsOnly, operator: Exists}]

    prometheusOperator:
      nodeSelector: {lab/rol: plataforma}
      tolerations: [{key: CriticalAddonsOnly, operator: Exists}]

    prometheus-node-exporter:
      tolerations: [{key: CriticalAddonsOnly, operator: Exists}]

    additionalPrometheusRulesMap:
      lab:
        groups:
          - name: lab
            rules:
              - alert: NodoCaido
                expr: 'up{job="node-exporter"} == 0'
                for: 2m
                labels: {severity: critical}
                annotations: {summary: "Nodo {{ $labels.instance }} sin responder"}
