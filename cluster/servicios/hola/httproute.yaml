# http://hola.<dominio_base>, por la Gateway de Traefik (Task 10).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hola
  namespace: hola
spec:
  parentRefs:
    - {name: traefik-gateway, namespace: kube-system, sectionName: web}
  hostnames: ["hola.${dominio_base}"]
  rules:
    - backendRefs:
        - {name: hola, port: 80}
